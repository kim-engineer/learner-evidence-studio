services:
  studio:
    build: .
    platform: linux/amd64
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:-lesson-demo-2026}
      STUDIO_TEACHER_NAME: ${STUDIO_TEACHER_NAME:-Amina Njeri (demo teacher)}
      STUDIO_CPU_THREADS: ${STUDIO_CPU_THREADS:-4}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      MOODLE_URL: ${MOODLE_URL:-}
      MOODLE_TOKEN: ${MOODLE_TOKEN:-}
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - studio-data:/var/lib/studio
      - model-cache:/var/cache/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  studio-data:
  model-cache:
